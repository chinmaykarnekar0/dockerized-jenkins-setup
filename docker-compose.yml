version: '3.8'

services:

  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: jenkins-server

    ports:
      - "${JENKINS_PORT}:8080"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xms512m -Xmx1024m"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/casc.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}

    volumes:
      - jenkins-data:/var/jenkins_home
      - ./jenkins_config:/var/jenkins_home/casc_configs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: always

  docker-agent:
    build:
      context: .
      dockerfile: docker-agent/Dockerfile
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
      JENKINS_AGENT_NAME: docker-agent

    container_name: jenkins-docker-agent

    privileged: true

    user: root

    volumes:
      - //var/run/docker.sock:/var/run/docker.sock

    tty: true

    restart: always

volumes:
  jenkins-data: